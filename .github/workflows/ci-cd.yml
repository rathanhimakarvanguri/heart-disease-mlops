name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8)
        run: flake8 src --max-line-length=110 --extend-ignore=E203

      - name: Generate dataset
        run: python data/download_data.py

      - name: Run unit tests
        run: pytest tests/ -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Train model (smoke run, logged to MLflow)
        run: |
          cd src
          python train.py
        # Fails the whole pipeline (per production-readiness requirement)
        # if training/tests errored above — GitHub Actions stops the job
        # on first non-zero exit by default.

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.pkl

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Build Docker image
        run: docker build -t heart-disease-api:${{ github.sha }} .

      - name: Smoke-test container
        run: |
          docker run -d -p 5000:5000 --name test-api heart-disease-api:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/health
          docker logs test-api
          docker stop test-api
